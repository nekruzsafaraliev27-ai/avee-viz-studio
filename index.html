<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BEYOND TIME — Blood Eyes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#050711;font-family:'Segoe UI',Arial,sans-serif;color:#e8f4ff;touch-action:none;user-select:none}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}
.panel{background:rgba(6,14,28,0.85);border:1px solid rgba(53,202,255,0.35);padding:10px 14px;border-radius:14px;backdrop-filter:blur(8px);box-shadow:0 0 20px rgba(0,170,255,0.12)}
#health{width:160px;height:10px;background:#1a2333;margin-top:6px;border-radius:10px;overflow:hidden;border:1px solid #2a3a55}
#healthFill{height:100%;width:100%;background:linear-gradient(90deg,#00eaff,#287bff);transition:width .2s;box-shadow:0 0 12px #00cfff}
#bloodBar{width:160px;height:7px;background:#1a1520;margin-top:5px;border-radius:8px;overflow:hidden;border:1px solid #4a2030}
#bloodFill{height:100%;width:0%;background:linear-gradient(90deg,#ff2a4a,#ff6b8a);transition:width .15s;box-shadow:0 0 10px #ff3355}
#message{position:absolute;top:100px;width:100%;text-align:center;font-size:20px;font-weight:700;color:#8deaff;text-shadow:0 0 18px #00aaff,0 0 40px #0066ff;opacity:0;transition:opacity .3s;pointer-events:none}
#message.show{opacity:1}
#combo{position:absolute;top:140px;width:100%;text-align:center;font-size:28px;font-weight:900;color:#ff4d6d;text-shadow:0 0 20px #ff0022;opacity:0;transition:opacity .25s}
#controls{position:absolute;bottom:20px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end}
#stick{width:130px;height:130px;border:2px solid rgba(88,223,255,0.5);border-radius:50%;background:rgba(8,30,55,0.45);position:relative;pointer-events:auto;box-shadow:0 0 25px rgba(0,180,255,0.15)}
#knob{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7aefff,#1a9fcc);position:absolute;left:39px;top:39px;box-shadow:0 0 22px #00cfff;transition:background .1s}
.buttons{display:grid;grid-template-columns:repeat(2,68px);gap:12px;pointer-events:auto}
button{width:68px;height:68px;border-radius:50%;border:1.5px solid rgba(100,230,255,0.7);background:rgba(8,30,55,0.7);color:#e0f7ff;font-weight:800;font-size:13px;box-shadow:0 0 18px rgba(0,170,255,0.25);cursor:pointer;transition:all .12s;letter-spacing:0.5px}
button:active{background:rgba(0,120,180,0.9);transform:scale(0.92);box-shadow:0 0 30px #00d4ff}
#skill{border-color:rgba(255,80,120,0.8);background:rgba(40,10,25,0.75);box-shadow:0 0 18px rgba(255,40,80,0.3)}
#skill:active{background:rgba(180,20,60,0.9)}
#switch{position:absolute;top:78px;right:12px;width:auto;height:36px;border-radius:10px;padding:0 14px;font-size:12px;pointer-events:auto;background:rgba(10,25,45,0.85);border:1px solid rgba(100,200,255,0.5)}
#hint{position:absolute;bottom:165px;left:16px;font-size:11px;color:#7a9bb0;line-height:1.4}
#waveInfo{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#waveInfo .wave{font-size:15px;font-weight:700;color:#a0e0ff;letter-spacing:1px}
#waveInfo .score{font-size:13px;color:#7ab0d0;margin-top:2px}
#bloodModeOverlay{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(80,0,20,0.55) 100%);opacity:0;transition:opacity .4s;z-index:5;mix-blend-mode:multiply}
#vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,0.6);z-index:4}
#startScreen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#0a1a2f 0%,#050711 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity .6s}
#startScreen.hide{opacity:0;pointer-events:none}
#startScreen h1{font-size:clamp(28px,7vw,48px);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#00eaff,#ff4d6d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(0,200,255,0.3);margin-bottom:8px}
#startScreen .sub{color:#7ab0d0;font-size:14px;margin-bottom:30px;letter-spacing:2px}
#startScreen .btn{padding:14px 40px;border-radius:30px;border:2px solid #35caff;background:rgba(0,100,160,0.3);color:#e0f7ff;font-size:18px;font-weight:700;cursor:pointer;pointer-events:auto;box-shadow:0 0 30px rgba(0,180,255,0.3);transition:all .2s}
#startScreen .btn:hover{background:rgba(0,140,200,0.5);transform:scale(1.05)}
#startScreen .desc{max-width:340px;text-align:center;color:#6a8aa0;font-size:13px;line-height:1.6;margin-top:24px}
</style>
</head>
<body>
<div id="game"></div>
<div id="bloodModeOverlay"></div>
<div id="vignette"></div>

<div id="startScreen">
  <h1>BEYOND TIME</h1>
  <div class="sub">BLOOD EYES</div>
  <button class="btn" id="startBtn">ОҒОЗИ БОЗӢ</button>
  <div class="desc">
    SKILL = Blood Eyes Mode (вақт суст мешавад)<br>
    ATK = зарба • DASH = суръат • ҶАҲИШ = ҷаҳиш<br>
    Душманҳоро нобуд кун, комбо ҷамъ кун, зинда бимон
  </div>
</div>

<div id="hud" style="display:none">
  <div class="top">
    <div class="panel">
      <b id="heroName">СЮЙ ЦИН</b>
      <div id="health"><div id="healthFill"></div></div>
      <div id="bloodBar"><div id="bloodFill"></div></div>
      <small id="hpText" style="font-size:11px;opacity:.8">100 / 100</small>
    </div>
    <div class="panel" style="text-align:right">
      <div id="stageLabel">ВОДИИ ХУН</div>
      <small style="opacity:.7">Мавҷ <span id="waveNum">1</span></small>
    </div>
  </div>
  <div id="waveInfo">
    <div class="wave">МАВҶ <span id="waveBig">1</span></div>
    <div class="score">Хол: <span id="scoreVal">0</span></div>
  </div>
  <button id="switch">ИВАЗИ ҚАҲРАМОН</button>
  <div id="message"></div>
  <div id="combo"></div>
  <div id="hint">Ҷойстик / WASD — ҳаракат<br>J = ATK • K = SKILL • Space = Ҷаҳиш</div>
  <div id="controls">
    <div id="stick"><div id="knob"></div></div>
    <div class="buttons">
      <button id="attack">ATK</button>
      <button id="skill">EYES</button>
      <button id="jump">ҶАҲИШ</button>
      <button id="dash">DASH</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050914);
scene.fog = new THREE.FogExp2(0x050914, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x6a9cff, 0x1a1020, 1.4));
const dirLight = new THREE.DirectionalLight(0xffe8d0, 1.6);
dirLight.position.set(12, 22, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 60;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
scene.add(dirLight);

const pointRed = new THREE.PointLight(0xff2244, 0.8, 30);
pointRed.position.set(0, 4, 0);
scene.add(pointRed);

const floorMat = new THREE.MeshStandardMaterial({color:0x0e1522, roughness:0.92, metalness:0.1});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(90, 45, 0x123a55, 0x0c1a2a);
grid.position.y = 0.02;
scene.add(grid);

const rockGeo = new THREE.DodecahedronGeometry(1, 0);
const rockMat = new THREE.MeshStandardMaterial({color:0x1a2535, roughness:1});
const crystalMat = new THREE.MeshStandardMaterial({color:0x1a4060, emissive:0x004488, emissiveIntensity:0.6, roughness:0.3});

for(let i=0; i<55; i++){
  const h = 0.8 + Math.random()*3.5;
  const rock = new THREE.Mesh(rockGeo, rockMat);
  rock.position.set((Math.random()-0.5)*70, h/2, (Math.random()-0.5)*70);
  rock.scale.set(0.5+Math.random()*0.9, h, 0.5+Math.random()*0.9);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);

  if(Math.random() > 0.7){
    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.35+Math.random()*0.4, 0), crystalMat);
    crystal.position.copy(rock.position);
    crystal.position.y = h + 0.4;
    crystal.rotation.y = Math.random()*Math.PI;
    scene.add(crystal);
  }
}

function mat(color, emissive=0x000000, intensity=0.9){
  return new THREE.MeshStandardMaterial({color, emissive, emissiveIntensity:intensity, roughness:0.55, metalness:0.2});
}

function createHero(type){
  const g = new THREE.Group();
  const isCap = type === 1;
  const robe = mat(isCap ? 0x3a4558 : 0x14182a);
  const gold = mat(0xd4a84b, 0x5a3000, 0.7);
  const skin = mat(0xd8a88a);
  const hair = mat(isCap ? 0xdce6f0 : 0x12101c);
  const energy = mat(isCap ? 0xffc94a : 0x1a9fff, isCap ? 0xaa5500 : 0x0055ff, 1.2);

  function part(geo, m, x,y,z, sx=1,sy=1,sz=1){
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(x,y,z);
    mesh.scale.set(sx,sy,sz);
    mesh.castShadow = true;
    g.add(mesh);
    return mesh;
  }

  part(new THREE.CylinderGeometry(0.28, 0.38, 0.95, 8), robe, 0, 1.22, 0);
  part(new THREE.SphereGeometry(0.26, 14, 12), skin, 0, 1.95, 0);
  part(new THREE.SphereGeometry(0.30, 12, 8), hair, 0, 2.12, -0.05, 1, 1, 0.88);
  part(new THREE.BoxGeometry(0.58, 0.7, 0.14), robe, 0, 1.2, -0.24);
  part(new THREE.BoxGeometry(0.6, 0.08, 0.16), gold, 0, 1.58, -0.24);

  for(let s of [-1,1]){
    part(new THREE.CylinderGeometry(0.09, 0.11, 0.7, 7), robe, s*0.4, 1.28, 0);
    part(new THREE.SphereGeometry(0.11, 8, 8), skin, s*0.41, 0.88, 0);
    part(new THREE.CylinderGeometry(0.12, 0.14, 0.68, 7), robe, s*0.18, 0.4, 0);
    part(new THREE.BoxGeometry(0.2, 0.12, 0.38), gold, s*0.18, 0.08, 0.1);
  }

  for(let i=0; i<6; i++){
    const lock = part(new THREE.ConeGeometry(0.06, 0.5, 5), hair, (i-2.5)*0.09, 2.0, 0.18);
    lock.rotation.x = 0.35 + Math.random()*0.2;
  }

  for(let i=0; i<3; i++){
    part(new THREE.SphereGeometry(0.05, 8, 8), energy, (i-1)*0.14, 1.92, 0.26);
  }

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.7, 0.03, 8, 48),
    energy
  );
  ring.rotation.x = Math.PI/2;
  ring.position.y = 0.08;
  g.add(ring);
  g.userData.ring = ring;
  g.userData.energy = energy;
  g.userData.isCap = isCap;
  return g;
}

let heroType = 0;
let hero = createHero(0);
hero.position.set(0, 0, 6);
scene.add(hero);

const enemies = [];
const particles = [];

function createEnemy(x, z, type=0){
  const g = new THREE.Group();
  let bodyCol, eyeCol, scale, hp, speed, dmg;

  if(type === 0){
    bodyCol = 0x5a1e2a; eyeCol = 0xff2222; scale = 1; hp = 90; speed = 0.022; dmg = 6;
  } else if(type === 1){
    bodyCol = 0x3a2040; eyeCol = 0xff66aa; scale = 0.85; hp = 55; speed = 0.038; dmg = 4;
  } else {
    bodyCol = 0x2a1520; eyeCol = 0xff4400; scale = 1.35; hp = 180; speed = 0.014; dmg = 12;
  }

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3*scale, 0.38*scale, 1.15*scale, 8),
    mat(bodyCol, 0x220011, 0.4)
  );
  body.position.y = 0.75*scale;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.24*scale, 12, 10),
    mat(0x9a5048, 0x331010, 0.3)
  );
  head.position.y = 1.5*scale;
  g.add(head);

  const eyes = new THREE.Mesh(
    new THREE.BoxGeometry(0.32*scale, 0.07*scale, 0.1),
    mat(eyeCol, eyeCol, 1.5)
  );
  eyes.position.set(0, 1.52*scale, 0.22*scale);
  g.add(eyes);

  for(let s of [-1,1]){
    const horn = new THREE.Mesh(
      new THREE.ConeGeometry(0.06*scale, 0.28*scale, 5),
      mat(0x2a1018)
    );
    horn.position.set(s*0.14*scale, 1.72*scale, -0.05);
    horn.rotation.z = s*0.4;
    g.add(horn);
  }

  g.position.set(x, 0, z);
  g.userData = {hp, maxHp:hp, speed, dmg, type, hitFlash:0, alive:true};
  scene.add(g);
  enemies.push(g);
  return g;
}

function spawnHitParticles(pos, color=0xff3355, count=12){
  for(let i=0; i<count; i++){
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.06+Math.random()*0.08, 6, 6),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9})
    );
    p.position.copy(pos);
    p.position.y += 1;
    p.userData.vel = new THREE.Vector3(
      (Math.random()-0.5)*0.25,
      0.1+Math.random()*0.2,
      (Math.random()-0.5)*0.25
    );
    p.userData.life = 1;
    scene.add(p);
    particles.push(p);
  }
}

function spawnBloodOrb(pos){
  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 10, 10),
    new THREE.MeshBasicMaterial({color:0xff2255, transparent:true, opacity:0.85})
  );
  orb.position.copy(pos);
  orb.position.y = 0.4;
  orb.userData = {isOrb:true, life:12, pulse:0};
  scene.add(orb);
  particles.push(orb);
}

let hp = 100, maxHp = 100;
let bloodMeter = 0;
let score = 0;
let wave = 1;
let combo = 0;
let comboTimer = 0;
let attackCd = 0, skillCd = 0, dashTime = 0, jumpVel = 0;
let bloodMode = false;
let bloodModeTimer = 0;
let moveX = 0, moveY = 0;
let gameStarted = false;
let waveClearTimer = 0;
let enemiesToSpawn = 0;
let spawnTimer = 0;

const keys = {};
const stick = document.getElementById("stick");
const knob = document.getElementById("knob");
let touching = false;

function joystick(e){
  const r = stick.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const max = 44, len = Math.hypot(dx, dy);
  if(len > max){ dx = dx/len*max; dy = dy/len*max; }
  knob.style.left = (39 + dx) + "px";
  knob.style.top = (39 + dy) + "px";
  moveX = dx / max;
  moveY = dy / max;
}
stick.addEventListener("pointerdown", e => {
  touching = true;
  stick.setPointerCapture(e.pointerId);
  joystick(e);
});
stick.addEventListener("pointermove", e => { if(touching) joystick(e); });
function stopStick(){
  touching = false; moveX = 0; moveY = 0;
  knob.style.left = "39px"; knob.style.top = "39px";
}
stick.addEventListener("pointerup", stopStick);
stick.addEventListener("pointercancel", stopStick);

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if(e.code === "Space") jump();
  if(e.key === "j" || e.key === "J") attack();
  if(e.key === "k" || e.key === "K") skill();
  if(e.key === "Shift") dash();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function showMsg(t, duration=1.6){
  const el = document.getElementById("message");
  el.textContent = t;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), duration*1000);
}

function showCombo(){
  const el = document.getElementById("combo");
  if(combo < 2){ el.style.opacity = 0; return; }
  el.textContent = combo + "x COMBO";
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, 800);
}

function attack(){
  if(attackCd > 0 || !gameStarted) return;
  attackCd = bloodMode ? 0.22 : 0.32;
  hero.userData.ring.scale.setScalar(1.4);
  setTimeout(() => hero.userData.ring.scale.setScalar(1), 120);

  const range = bloodMode ? 4.2 : 3.0;
  const dmg = bloodMode ? 48 : (hero.userData.isCap ? 42 : 34);

  enemies.forEach(e => {
    if(!e.userData.alive) return;
    const dist = hero.position.distanceTo(e.position);
    if(dist < range){
      e.userData.hp -= dmg;
      e.userData.hitFlash = 0.25;
      e.children[0].material.emissive.setHex(0xff2222);
      spawnHitParticles(e.position, bloodMode ? 0xff4488 : 0xff3355, bloodMode ? 16 : 10);

      if(bloodMode){
        const tendril = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.02, dist, 6),
          new THREE.MeshBasicMaterial({color:0xff2266, transparent:true, opacity:0.7})
        );
        tendril.position.copy(hero.position).lerp(e.position, 0.5);
        tendril.position.y = 1.2;
        tendril.lookAt(e.position.x, 1.2, e.position.z);
        tendril.rotateX(Math.PI/2);
        scene.add(tendril);
        setTimeout(() => scene.remove(tendril), 180);
      }

      bloodMeter = Math.min(100, bloodMeter + (bloodMode ? 8 : 12));
      updateBloodUI();

      if(e.userData.hp <= 0){
        killEnemy(e);
      } else {
        showMsg("Зарба!");
      }
    }
  });
}

function killEnemy(e){
  e.userData.alive = false;
  e.visible = false;
  spawnHitParticles(e.position, 0xff1144, 22);
  spawnBloodOrb(e.position);

  combo++;
  comboTimer = 2.8;
  showCombo();

  const pts = 100 + combo * 25 + (e.userData.type * 40);
  score += pts;
  document.getElementById("scoreVal").textContent = score;

  showMsg(combo > 3 ? "КОМБОИ ХУБ!" : "Душман мағлуб шуд!", 1.1);

  if(enemies.every(en => !en.userData.alive)){
    waveClearTimer = 2.2;
    showMsg("МАВҶИ " + wave + " ТОЗА ШУД!", 2);
  }
}

function skill(){
  if(skillCd > 0 || !gameStarted) return;
  if(bloodMeter < 35 && !bloodMode) return;

  if(!bloodMode){
    bloodMode = true;
    bloodModeTimer = 4.5 + (bloodMeter / 40);
    bloodMeter = Math.max(0, bloodMeter - 35);
    skillCd = 0.5;
    document.getElementById("bloodModeOverlay").style.opacity = "1";
    showMsg("BLOOD EYES — ВАҚТ СУСТ ШУД!", 2.2);
    hero.userData.ring.material.emissiveIntensity = 2.5;
  } else {
    bloodBurst();
  }
  updateBloodUI();
}

function bloodBurst(){
  skillCd = 1.2;
  const blast = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 20, 16),
    new THREE.MeshBasicMaterial({color:0xff2266, transparent:true, opacity:0.5, wireframe:true})
  );
  blast.position.copy(hero.position);
  blast.position.y = 1.1;
  scene.add(blast);

  let s = 1;
  const iv = setInterval(() => {
    s += 0.45;
    blast.scale.setScalar(s);
    blast.material.opacity = Math.max(0, 0.55 - s*0.07);
    enemies.forEach(e => {
      if(e.userData.alive && hero.position.distanceTo(e.position) < s + 1.2){
        e.userData.hp -= 18;
        e.userData.hitFlash = 0.2;
        if(e.userData.hp <= 0) killEnemy(e);
      }
    });
    if(s > 7){ clearInterval(iv); scene.remove(blast); }
  }, 40);
  showMsg("ХУНИ ТАРКИШ!");
}

function jump(){
  if(hero.position.y < 0.08 && gameStarted) jumpVel = 0.21;
}

function dash(){
  if(dashTime > 0 || !gameStarted) return;
  dashTime = 0.28;
  spawnHitParticles(hero.position, hero.userData.isCap ? 0xffcc44 : 0x44aaff, 8);
}

function updateBloodUI(){
  document.getElementById("bloodFill").style.width = bloodMeter + "%";
}

function updateHpUI(){
  document.getElementById("healthFill").style.width = (hp/maxHp*100) + "%";
  document.getElementById("hpText").textContent = Math.ceil(hp) + " / " + maxHp;
}

function startWave(){
  wave++;
  document.getElementById("waveNum").textContent = wave;
  document.getElementById("waveBig").textContent = wave;
  showMsg("МАВҶИ " + wave + " ОҒОЗ!", 2);

  const count = 3 + Math.floor(wave * 1.4);
  enemiesToSpawn = count;
  spawnTimer = 0.6;

  for(let i = enemies.length-1; i>=0; i--){
    if(!enemies[i].userData.alive){
      scene.remove(enemies[i]);
      enemies.splice(i, 1);
    }
  }
}

function spawnOneEnemy(){
  const angle = Math.random() * Math.PI * 2;
  const dist = 14 + Math.random()*8;
  const x = hero.position.x + Math.cos(angle)*dist;
  const z = hero.position.z + Math.sin(angle)*dist;

  let type = 0;
  if(wave > 2 && Math.random() > 0.55) type = 1;
  if(wave > 4 && Math.random() > 0.7) type = 2;
  if(wave > 6 && Math.random() > 0.85) type = 2;

  createEnemy(x, z, type);
}

document.getElementById("switch").onclick = () => {
  if(!gameStarted) return;
  scene.remove(hero);
  const pos = hero.position.clone();
  heroType = 1 - heroType;
  hero = createHero(heroType);
  hero.position.copy(pos);
  scene.add(hero);
  document.getElementById("heroName").textContent = heroType ? "КАПИТАН" : "СЮЙ ЦИН";
  showMsg(heroType ? "Капитан ворид шуд!" : "Сюй Цин ворид шуд!");
};

document.getElementById("attack").onclick = attack;
document.getElementById("skill").onclick = skill;
document.getElementById("jump").onclick = jump;
document.getElementById("dash").onclick = dash;

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startScreen").classList.add("hide");
  document.getElementById("hud").style.display = "block";
  gameStarted = true;
  for(let i=0; i<4; i++){
    const a = (i/4)*Math.PI*2;
    createEnemy(Math.cos(a)*11, Math.sin(a)*11, 0);
  }
  showMsg("Душманро мағлуб кун!", 2.5);
};

let last = 0;
function animate(t){
  requestAnimationFrame(animate);
  const dt = Math.min((t - last)/16.67, 2.2);
  last = t;

  if(!gameStarted){
    renderer.render(scene, camera);
    return;
  }

  let x = moveX, z = moveY;
  if(keys.w || keys.arrowup) z = -1;
  if(keys.s || keys.arrowdown) z = 1;
  if(keys.a || keys.arrowleft) x = -1;
  if(keys.d || keys.arrowright) x = 1;

  const moving = Math.hypot(x, z) > 0.08;
  if(moving){
    const angle = Math.atan2(x, z);
    hero.rotation.y = angle;
    let speed = dashTime > 0 ? 0.42 : (bloodMode ? 0.145 : 0.11);
    if(hero.userData.isCap) speed *= 0.92;
    else speed *= 1.08;
    hero.position.x += x * speed * dt;
    hero.position.z += z * speed * dt;

    hero.position.x = Math.max(-38, Math.min(38, hero.position.x));
    hero.position.z = Math.max(-38, Math.min(38, hero.position.z));
  }

  if(dashTime > 0) dashTime -= 0.016 * dt;
  if(attackCd > 0) attackCd -= 0.016 * dt;
  if(skillCd > 0) skillCd -= 0.016 * dt;
  if(comboTimer > 0){
    comboTimer -= 0.016 * dt;
    if(comboTimer <= 0){ combo = 0; showCombo(); }
  }

  hero.position.y += jumpVel * dt;
  jumpVel -= 0.013 * dt;
  if(hero.position.y < 0){ hero.position.y = 0; jumpVel = 0; }

  hero.userData.ring.rotation.z += (bloodMode ? 0.06 : 0.028) * dt;
  hero.userData.ring.position.y = 0.1 + Math.sin(t * 0.005) * 0.07;
  if(bloodMode) hero.userData.ring.scale.setScalar(1.15 + Math.sin(t*0.01)*0.1);

  if(bloodMode){
    bloodModeTimer -= 0.016 * dt;
    if(bloodModeTimer <= 0){
      bloodMode = false;
      document.getElementById("bloodModeOverlay").style.opacity = "0";
      hero.userData.ring.material.emissiveIntensity = 0.9;
      showMsg("Blood Eyes хомӯш шуд");
    }
  }

  const camTarget = new THREE.Vector3(
    hero.position.x - Math.sin(hero.rotation.y)*1.5,
    hero.position.y + 3.2,
    hero.position.z + 7.5
  );
  camera.position.lerp(camTarget, 0.07);
  camera.lookAt(hero.position.x, hero.position.y + 1.3, hero.position.z);

  pointRed.position.x = hero.position.x;
  pointRed.position.z = hero.position.z;
  pointRed.intensity = bloodMode ? 1.6 : 0.7;

  const timeScale = bloodMode ? 0.32 : 1;
  enemies.forEach(e => {
    if(!e.userData.alive) return;

    if(e.userData.hitFlash > 0){
      e.userData.hitFlash -= 0.016 * dt;
      if(e.userData.hitFlash <= 0) e.children[0].material.emissive.setHex(0x220011);
    }

    const d = e.position.distanceTo(hero.position);
    if(d > 1.6 && d < 22){
      const dir = new THREE.Vector3().subVectors(hero.position, e.position).normalize();
      e.position.addScaledVector(dir, e.userData.speed * timeScale * dt);
      e.lookAt(hero.position.x, 0, hero.position.z);
    }

    if(d < 1.4 && Math.random() < 0.012 * timeScale){
      hp = Math.max(0, hp - e.userData.dmg);
      updateHpUI();
      spawnHitParticles(hero.position, 0xff6644, 6);
      if(hp <= 0){
        showMsg("ШУМО БОХТЕД — САҲИФАРО НАВ КУНЕД", 5);
        gameStarted = false;
      }
    }
  });

  for(let i = particles.length-1; i>=0; i--){
    const p = particles[i];
    if(p.userData.isOrb){
      p.userData.pulse += 0.08 * dt;
      p.scale.setScalar(1 + Math.sin(p.userData.pulse)*0.15);
      p.position.y = 0.4 + Math.sin(p.userData.pulse*0.7)*0.15;
      p.userData.life -= 0.016 * dt;

      if(hero.position.distanceTo(p.position) < 1.5){
        bloodMeter = Math.min(100, bloodMeter + 22);
        hp = Math.min(maxHp, hp + 8);
        updateBloodUI();
        updateHpUI();
        score += 30;
        document.getElementById("scoreVal").textContent = score;
        scene.remove(p);
        particles.splice(i, 1);
        showMsg("+ Хун");
        continue;
      }
      if(p.userData.life <= 0){
        scene.remove(p);
        particles.splice(i, 1);
      }
    } else {
      p.position.addScaledVector(p.userData.vel, dt);
      p.userData.vel.y -= 0.012 * dt;
      p.userData.life -= 0.035 * dt;
      p.material.opacity = p.userData.life;
      p.scale.multiplyScalar(0.97);
      if(p.userData.life <= 0){
        scene.remove(p);
        particles.splice(i, 1);
      }
    }
  }

  if(waveClearTimer > 0){
    waveClearTimer -= 0.016 * dt;
    if(waveClearTimer <= 0) startWave();
  }

  if(enemiesToSpawn > 0){
    spawnTimer -= 0.016 * dt;
    if(spawnTimer <= 0){
      spawnOneEnemy();
      enemiesToSpawn--;
      spawnTimer = 0.45 + Math.random()*0.4;
    }
  }

  renderer.render(scene, camera);
}
animate(0);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
